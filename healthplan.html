<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSCI225 BMI Calculator of Tim Tyulenev</title>
        <!-- I used AI to simplify styling of the page-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <div class="container py-5" style="max-width: 800px;">
            <h1 class="text-center mb-4">BMI and Calorie Calculator</h1>

            <div class="card mb-4">
                <div class="card-body p-4">
                    <form>
                        <h2 class="h5 mb-3">Please write your information for BMI calculation</h2>
                        
                        <div class="mb-3">
                            <label for="weight" class="form-label">Weight (kg):</label>
                            <input type="number" class="form-control" id="weight" placeholder="Enter weight">
                        </div>
                        
                        <div class="mb-3">
                            <label for="height" class="form-label">Height (cm):</label>
                            <input type="number" class="form-control" id="height" placeholder="Enter height">
                        </div>
                        
                        <div class="mb-3">
                            <label for="age" class="form-label">Age:</label>
                            <input type="number" class="form-control" id="age" placeholder="Enter age">
                        </div>
                        
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender:</label>
                            <select class="form-select" id="gender" required>
                                <option value="male">Men</option>
                                <option value="female">Women</option>
                            </select>
                        </div>
                    </form>

                    <button id="submit" class="btn btn-primary w-100">Generate meal plan</button>
                </div>
            </div>

            <div class="card shadow-sm" id="output">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-md-7">
                            <p id="bmi" class="fs-4 fw-bold mb-1"></p>
                            <p id="weightCategory" class="text-secondary fw-semibold mb-3"></p>
                            <p id="foodResults" class="mb-2"></p>
                            <p id="totalCalories" class="fs-5 text-success fw-bold mb-0"></p>
                        </div>
                        
                       
                        <div class="col-md-5 text-center overflow-hidden mt-3 mt-md-0">
                            <img id="bodyImage" src="img/template.png" alt="template for body" class="img-fluid" style="max-height: 260px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- The end of HTML and start of JavaScript code -->

        <script>
            const foodDatabase = [
                { name: "Apple (1 medium)", cal: 95 },
                { name: "Banana (1 medium)", cal: 105 },
                { name: "Orange (1 medium)", cal: 62 },
                { name: "Grapes (1 cup)", cal: 104 },
                { name: "Strawberries (1 cup)", cal: 49 },
                { name: "Broccoli (1 cup)", cal: 55 },
                { name: "Carrots (1 cup)", cal: 52 },
                { name: "Spinach (1 cup)", cal: 7 },
                { name: "Potato (1 medium)", cal: 161 },
                { name: "Sweet Potato (1 medium)", cal: 103 },
                { name: "Avocado (half)", cal: 117 },
                { name: "Chicken Breast (4oz)", cal: 165 },
                { name: "Salmon (4oz)", cal: 235 },
                { name: "Ground Beef 80/20 (4oz)", cal: 287 },
                { name: "Egg (1 large)", cal: 72 },
                { name: "Tofu (1/2 cup)", cal: 94 },
                { name: "Black Beans (1/2 cup)", cal: 114 },
                { name: "Lentils (1/2 cup)", cal: 115 },
                { name: "Plain Greek Yogurt (1 cup)", cal: 100 },
                { name: "Almonds (1 oz)", cal: 164 },
                { name: "Peanuts (1 oz)", cal: 161 },
                { name: "Peanut Butter (2 tbsp)", cal: 188 },
                { name: "Brown Rice (1 cup cooked)", cal: 216 },
                { name: "White Rice (1 cup cooked)", cal: 205 },
                { name: "Quinoa (1 cup cooked)", cal: 222 },
                { name: "Oats (1/2 cup dry)", cal: 150 },
                { name: "Whole Wheat Bread (1 slice)", cal: 69 },
                { name: "White Bread (1 slice)", cal: 75 },
                { name: "Pasta (1 cup cooked)", cal: 220 },
                { name: "Bagel (1 medium)", cal: 245 },
                { name: "Flour Tortilla (8 inch)", cal: 144 },
                { name: "Vanilla Ice Cream (1/2 cup)", cal: 137 },
                { name: "Chocolate Chip Cookie (1 medium)", cal: 148 },
                { name: "Potato Chips (1 oz)", cal: 152 },
                { name: "Pretzels (1 oz)", cal: 108 },
                { name: "Cheddar Cheese (1 oz)", cal: 113 },
                { name: "Butter (1 tbsp)", cal: 102 },
                { name: "Olive Oil (1 tbsp)", cal: 119 },
                { name: "Whole Milk (1 cup)", cal: 149 },
                { name: "Almond Milk (1 cup)", cal: 39 },
                { name: "Orange Juice (1 cup)", cal: 112 },
                { name: "Cola (12 oz)", cal: 140 },
                { name: "Black Coffee (8 oz)", cal: 2 },
                { name: "Bacon (2 slices)", cal: 86 },
                { name: "Pork Sausage (1 link)", cal: 133 },
                { name: "Pancakes (2 medium)", cal: 172 },
                { name: "Waffle (1 large)", cal: 218 },
                { name: "Honey (1 tbsp)", cal: 64 },
                { name: "Maple Syrup (1 tbsp)", cal: 52 },
                { name: "Cheese Pizza (1 slice)", cal: 285 }
            ];
            function mealPlanMaker(mealdatabase, targetCalories) {
                let mealplan = [];
                let total = 0;
                let attempts = 0;

                while (total < targetCalories && attempts < 200) {
                    let randomIndex = Math.floor(Math.random() * mealdatabase.length);
                    let randomFood = mealdatabase[randomIndex];

                    if (total + randomFood.cal <= targetCalories) {
                        mealplan.push(randomFood);
                        total = total + randomFood.cal;
                    } else if (targetCalories - total < 2) { 
                        /* stopping before adding the lowest possible food option
                        to go over the calorie limit for the day */
                        break;
                    }
                    attempts++;
                } return {
                    mealplan: mealplan,
                    total: total
                };
            }
            function calculateBMI(weight, height, age, gender){
                let bmi = weight / (height / 100) ** 2;
                let calorieBasic = 0;
                if (gender === 'male') {
                    calorieBasic = (weight * 10) + (height * 6.25) - (age * 5) + 5;
                } else {
                    calorieBasic = (weight * 10) + (height * 6.25) - (age * 5) - 161;
                }

                let calorieTarget = 0;
                let category;
                if (bmi >= 30.0) {
                    calorieTarget = calorieBasic - 750;
                    category = 'Obese';
                } else if (bmi >= 25.0 && bmi < 30.0) {
                    calorieTarget = calorieBasic - 500;
                    category = "Overweight";
                } else {
                    calorieTarget = calorieBasic;
                    category = "Normal";
                } return {
                    bmi: bmi,
                    target: calorieTarget,
                    basic: calorieBasic,
                    category: category
                };
                
            }
            function transformImage(bmi){
                let body = document.getElementById("bodyImage");
                let scaleFactor = 1 + (bmi - 22) * 0.02;
                if (scaleFactor < 0.8){
                    scaleFactor = 0.8;
                } else if (scaleFactor > 1.4){
                    scaleFactor = 1.4;
                }
                body.animate([
                    { transform: 'scaleX(1)' },
                    { transform: 'scaleX(' + scaleFactor + ')' }
                ], {
                    duration: 400,
                    iterations: 1,
                    fill: "forwards"
                });
            }
            function getOutput() {

                let weight = Number(document.getElementById("weight").value);
                let height = Number(document.getElementById("height").value);
                let age = Number(document.getElementById("age").value);
                let gender = document.getElementById("gender").value;

                if (weight <= 0 || height <= 0 || age <= 0) {
                    alert("Please make sure to fill every input!");
                    return;
                }
                
                let results = calculateBMI(weight, height, age, gender);
                document.getElementById('bmi').textContent = 
                    "Your BMI: " + results.bmi.toFixed(2);
                document.getElementById('weightCategory').textContent =
                    "Your weight category: " + results.category;
                    
                transformImage(results.bmi);
                let calorieTarget = Math.round(results.target);
                let planresult = mealPlanMaker(foodDatabase, calorieTarget);
                let meallist = "<h2>Meal Plan (Target: " + calorieTarget + " cal)</h2><br>";

                for (let k = 0; k < planresult.mealplan.length; k++) {
                    meallist += "> " + planresult.mealplan[k].name +
                    " — " + planresult.mealplan[k].cal + " cal<br>";
                }

                document.getElementById("foodResults").innerHTML = meallist;
                document.getElementById("totalCalories").innerHTML = 
                "Total: " + planresult.total + " cal";
            }
            document.getElementById("submit").addEventListener("click", getOutput);
        </script>
    </body>
</html>
